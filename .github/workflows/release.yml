name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not set. Building unsigned release APK."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi

          ARTIFACT_NAME="package-installer-${TAG_NAME}.apk"
          cp "$APK_PATH" "$ARTIFACT_NAME"
          echo "RELEASE_APK=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "Artifact prepared: $ARTIFACT_NAME from $APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Package Installer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release.keystore"
